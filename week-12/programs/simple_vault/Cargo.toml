[package]
name = "simple_vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "simple_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "raydium-clmm-cpi/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", features = ["memo"] }
raydium-clmm-cpi = { git = "https://github.com/raydium-io/raydium-cpi", rev = "5aeec4b40b09c7f42e28a0f697132b76de872856", features = ["cpi", "devnet"] }
blake3 = "=1.5.5"
constant_time_eq = "=0.3.1"
